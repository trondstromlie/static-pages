<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Static Pages</title>
<style>
  :root {
    --bg: #fbfaf8;
    --surface: #ffffff;
    --border: #e6e2db;
    --text: #1d1b18;
    --muted: #6f6a62;
    --accent: #1f6f4a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171614;
      --surface: #1f1e1b;
      --border: #32302c;
      --text: #f1efea;
      --muted: #a29c93;
      --accent: #6fcf9a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171614;
    --surface: #1f1e1b;
    --border: #32302c;
    --text: #f1efea;
    --muted: #a29c93;
    --accent: #6fcf9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 64px 16px 96px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lead { color: var(--muted); margin: 0 0 40px; }
  h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 40px 0 12px; font-weight: 600;
  }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  a.card {
    display: block; padding: 16px 18px; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    transition: border-color .15s ease, transform .15s ease;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
  a.card strong { display: block; font-size: 1.05rem; }
  a.card span { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Static Pages</h1>
  <p class="lead">Samling av frittstående HTML-sider. Én mappe per person, én undermappe per prosjekt.</p>

  <h2>Trond</h2>
  <ul>
    <li>
      <a class="card" href="trond/presentasjon/">
        <strong>Presentasjon</strong>
        <span>Enkel slide-deck i én HTML-fil</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
